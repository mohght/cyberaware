<script>
'use strict';
const pair=(ar,en)=>({ar,en});
const categories=[pair('أمن كلمات المرور والحسابات','Password and Account Security'),pair('التصيد والهندسة الاجتماعية','Phishing and Social Engineering'),pair('أمن الأجهزة والبرامج','Device and Software Security'),pair('الخصوصية وحماية البيانات والاستخدام الآمن للإنترنت','Privacy, Personal Data, and Safe Internet Use'),pair('الأمان الرقمي للأسرة والمعاملات المالية','Family, Financial, and Digital Safety')];
const shortCats=[pair('الحسابات','Accounts'),pair('التصيد','Phishing'),pair('الأجهزة','Devices'),pair('الخصوصية','Privacy'),pair('الأسرة والمال','Family & Money')];
// Options are authored in ascending score order. Only display order is shuffled.
const questions=[];
function Q(topic,topicEn,ar,en,a,e,why,whyEn,tip,tipEn){questions.push({topic:pair(topic,topicEn),text:pair(ar,en),options:a.map((x,i)=>({label:pair(x,e[i]),score:i+1})),why:pair(why,whyEn),tip:pair(tip,tipEn)});}
Q('قوة كلمة المرور','Password strength','عندما تنشئ كلمة مرور لحساب مهم، ماذا تختار؟','When creating a password for an important account, what do you choose?',
['اسمي أو تاريخ ميلادي.','كلمة قصيرة مع رقم أو رمز.','عبارة طويلة، لكن فيها معلومات معروفة عني.','كلمة مرور مولدة عشوائيا أو عبارة طويلة من كلمات غير مترابطة.'],
['My name or date of birth.','A short word with a number or symbol.','A long phrase that includes known facts about me.','A randomly generated password or a long phrase of unrelated words.'],
'المعلومات الشخصية والكلمات القصيرة أسهل في التخمين.','Personal details and short passwords are easier to guess.',
'أنشئ كلمة مرور طويلة وفريدة لبريدك، باستخدام مدير كلمات مرور موثوق.','Create a long, unique password for your email with a trusted password manager.');
Q('كلمات مرور فريدة','Unique passwords','كيف تستخدم كلمات المرور بين حساباتك المختلفة؟','How do you use passwords across different accounts?',
['أستخدم كلمة المرور نفسها في كل مكان.','أغير رقما صغيرا في كلمة المرور نفسها.','أستخدم كلمات فريدة للحسابات المهمة فقط.','أستخدم كلمة مرور مختلفة تماما لكل حساب.'],
['I use the same password everywhere.','I change a small number in the same password.','I use unique passwords only for important accounts.','I use a completely different password for every account.'],
'تسريب كلمة مرور معاد استخدامها قد يفتح أكثر من حساب.','One leaked reused password can expose several accounts.',
'ابدأ باستبدال كلمات المرور المتكررة في البريد والخدمات المالية.','Replace reused passwords on email and financial accounts first.');
Q('إدارة كلمات المرور','Managing passwords','كيف تحتفظ بكلمات مرورك؟','How do you keep track of your passwords?',
['أضعها في ملاحظة غير محمية أو محادثة.','أحفظ كلمات سهلة ومتكررة في ذاكرتي.','أحتفظ بكلمات فريدة على ورقة في مكان خاص وآمن.','أستخدم مدير كلمات مرور موثوقا ومحميا بكلمة رئيسية قوية وتحقق إضافي عند توفره.'],
['I keep them in an unprotected note or chat.','I remember simple, repeated passwords.','I keep unique passwords on paper in a private, secure place.','I use a trusted password manager with a strong master password and extra verification where available.'],
'القائمة غير المحمية قد تكشف جميع حساباتك، وتكرار كلمات المرور يضاعف الخطر.','An unprotected list can expose all accounts; password reuse increases the risk.',
'احم مدير كلمات المرور، واحتفظ بطريقة استرداده في مكان آمن.','Secure your password manager and keep its recovery method somewhere safe.');
Q('التحقق متعدد العوامل','Multi-factor authentication','ماذا تفعل عندما يتيح حسابك خطوة تحقق إضافية عند الدخول؟','What do you do when an account offers an extra sign-in verification step?',
['أتجاهلها أو ألغيها لتسهيل الدخول.','أفعلها لحساب واحد فقط وأترك بقية الحسابات المهمة.','أفعل رمز الرسالة النصية للحسابات المهمة.','أفعلها لكل الحسابات المهمة، وأفضل مفتاح مرور أو مفتاح أمان عند توفره.'],
['I ignore it or turn it off for convenience.','I enable it on one account but leave other important accounts unprotected.','I enable text-message codes on important accounts.','I enable it on all important accounts and prefer a passkey or security key where available.'],
'الاعتماد على كلمة المرور وحدها يترك الحساب معرضا للخطر إذا انكشفت.','A password alone leaves an account exposed if it is stolen.',
'فعل التحقق متعدد العوامل لبريدك؛ أي طريقة متاحة أفضل عادة من عدم تفعيله.','Enable multi-factor authentication for email; an available method is generally better than none.');
Q('استرداد الحساب','Account recovery','كيف تحمي وسائل استرداد حساباتك؟','How do you protect your account recovery methods?',
['لا أعرفها، وقد تكون قديمة أو مكشوفة.','أحدث رقم الهاتف فقط عندما أفقد الدخول.','أحدث بيانات الاسترداد، لكن أترك بريد الاسترداد دون تحقق إضافي.','أراجعها وأحمي بريد الاسترداد وأحتفظ برموز الاسترداد في مكان آمن.'],
['I do not know them; they may be outdated or exposed.','I update my phone number only after losing access.','I update recovery details but leave recovery email without extra verification.','I review them, secure recovery email, and keep recovery codes somewhere safe.'],
'وسيلة استرداد ضعيفة قد تسمح لغيرك بالسيطرة على حساب محمي جيدا.','A weak recovery method can undermine an otherwise well-protected account.',
'راجع رقم وبريد الاسترداد اليوم، واحفظ الرموز الاحتياطية بعيدا عن الآخرين.','Review recovery phone and email today; keep backup codes away from others.');
Q('رسالة بنكية عاجلة','Urgent bank message','تصلك رسالة بأن حسابك البنكي سيغلق، وفيها رابط. ماذا تفعل؟','A message says your bank account will close and includes a link. What do you do?',
['أفتح الرابط وأدخل بياناتي بسرعة.','أرد على الرسالة وأسأل المرسل إن كانت حقيقية.','أتجاهل الرسالة، لكن لا أتحقق من وضع الحساب.','أفتح تطبيق البنك بنفسي وأتحقق، وأبلغ عن الرسالة المشبوهة.'],
['I open the link and enter my details quickly.','I reply and ask the sender if it is real.','I ignore it but do not check my account status.','I open the bank app myself, check, and report the suspicious message.'],
'الاستعجال قد يدفعك إلى صفحة مزيفة تجمع بيانات الدخول.','Urgency can push you onto a fake sign-in page.',
'افتح التطبيق الرسمي مباشرة للتحقق من الرسائل البنكية غير المتوقعة.','Open the official app directly to check unexpected bank messages.');
Q('فحص الروابط','Checking links','يرسل لك شخص رابط جائزة غير متوقعة. كيف تتعامل معه؟','Someone sends an unexpected prize link. How do you handle it?',
['أفتحه لأن الجائزة مغرية.','أثق فيه إذا ظهرت علامة القفل أو شعار معروف.','أفحص العنوان وأرفضه إذا بدا غريبا.','لا أستخدم الرابط؛ أتحقق من العرض عبر موقع الجهة الذي أعرفه.'],
['I open it because the prize looks attractive.','I trust a padlock or familiar logo.','I inspect the address and reject it if it looks strange.','I avoid the link and verify the offer through the organization’s known website.'],
'يمكن تقليد الشعارات، كما يمكن للمواقع المحتالة استخدام اتصال مشفر.','Logos can be copied, and scam sites can use encrypted connections.',
'تحقق من العرض عبر عنوان رسمي تكتبه بنفسك، ولا تعتمد على مظهر الرابط وحده.','Verify the offer at an official address you enter yourself; appearance alone is not enough.');
Q('انتحال الدعم الفني','Fake technical support','يتصل شخص يدعي أنه من الدعم الفني ويطلب التحكم في جهازك. ماذا تفعل؟','A caller claiming to be technical support asks to control your device. What do you do?',
['أثبت البرنامج الذي يطلبه وأمنحه الدخول.','أسمح له إذا عرف اسمي ونوع جهازي.','أرفض الدخول، لكن أواصل إعطاءه معلومات عن الجهاز والحسابات.','أنهي الاتصال وأتواصل مع الدعم عبر قناة رسمية إن احتجت مساعدة.'],
['I install the program and give access.','I allow it if they know my name and device type.','I refuse access but keep sharing device and account details.','I end the call and contact official support if I need help.'],
'المتصل المنتحل قد يستغل معلوماتك أو التحكم عن بعد لسرقة حساباتك.','An impersonator can misuse your details or remote access to steal accounts.',
'لا تمنح متصلا غير متوقع تحكما عن بعد، حتى لو عرف بعض معلوماتك.','Do not give an unexpected caller remote access, even if they know some details about you.');
Q('مرفقات البريد','Email attachments','تصلك فاتورة غير متوقعة من اسم مألوف. ماذا تفعل بالمرفق؟','An unexpected invoice arrives from a familiar name. What do you do with the attachment?',
['أفتحه وأوافق على تمكين المحتوى إذا طلب ذلك.','أفتحه لأن اسم المرسل مألوف.','أفحص عنوان البريد وأتجنب الملف إذا لاحظت خطأ.','أتحقق من المرسل بوسيلة مستقلة قبل فتح المرفق غير المتوقع.'],
['I open it and enable content if asked.','I open it because I recognize the sender’s name.','I check the email address and avoid the file if I spot an error.','I verify with the sender through a separate channel before opening it.'],
'اسم المرسل قد يكون مزيفا أو حسابه مخترقا، وقد يحتوي المرفق على برنامج ضار.','The name may be spoofed or the account compromised; an attachment may contain malware.',
'اتصل بالمرسل المعروف على رقمه المحفوظ قبل فتح مرفق لم تتوقعه.','Call the known sender using a saved number before opening an unexpected attachment.');
Q('التحقق من الهوية','Verifying identity','تطلب رسالة باسم جهة معروفة صورة هويتك لتحديث ملفك. ماذا تفعل؟','A message from a known organization requests your ID photo to update a file. What do you do?',
['أرسل الصورة مباشرة.','أرسلها إذا كان الشعار والتوقيع مقنعين.','أطلب من المرسل إثبات هويته داخل المحادثة نفسها.','أتحقق عبر رقم أو تطبيق رسمي، وأشارك الحد الضروري عبر قناة آمنة فقط.'],
['I send the photo immediately.','I send it if the logo and signature look convincing.','I ask the sender to prove their identity in the same conversation.','I verify through an official number or app, then share only what is needed through a secure channel.'],
'الشعار وإجابات المنتحل لا تثبت هويته، وصورة الهوية قد يساء استخدامها.','A logo and the sender’s own claims do not prove identity; an ID image can be misused.',
'استخدم قناة مستقلة ومعروفة للتحقق قبل مشاركة أي وثيقة شخصية.','Use an independent, known channel before sharing any personal document.');
Q('تحديث البرامج','Software updates','كيف تتعامل مع تحديثات النظام والتطبيقات؟','How do you handle system and app updates?',
['أعطل التحديثات أو أتجاهلها دائما.','أثبتها فقط إذا توقف شيء عن العمل.','أحدث يدويا كل فترة، وقد أؤخر تحديثات الأمان.','أفعل التحديث التلقائي وأثبت تحديثات الأمان وإعادة التشغيل المطلوبة قريبا.'],
['I disable or always ignore updates.','I install them only when something stops working.','I update occasionally and may delay security fixes.','I enable automatic updates and promptly complete security updates and required restarts.'],
'التأخير يترك ثغرات معروفة دون إصلاح.','Delays leave known security weaknesses unfixed.',
'راجع تحديثات هاتفك وحاسوبك وفعل التحديث التلقائي.','Check phone and computer updates and enable automatic updates.');
Q('قفل الشاشة','Screen locking','كيف تحمي شاشة هاتفك وحاسوبك عند الابتعاد؟','How do you protect your phone and computer when you step away?',
['لا أستخدم قفل شاشة.','أستخدم رمزا سهلا وأترك الشاشة مفتوحة طويلا.','أستخدم قفلا قويا، لكن أعتمد على القفل اليدوي فقط.','أستخدم قفلا قويا وقفل شاشة تلقائيا بعد وقت قصير، وأقفل عند الابتعاد.'],
['I do not use a screen lock.','I use an easy code and leave the screen unlocked for a long time.','I use a strong lock but rely only on manual locking.','I use a strong lock, a short automatic lock delay, and lock when stepping away.'],
'الجهاز المفتوح يسمح بقراءة الرسائل والوصول للحسابات.','An unlocked device allows access to messages and accounts.',
'اختر رمزا غير متوقع وفعل قفل الشاشة التلقائي خلال وقت قصير.','Choose a hard-to-guess code and a short automatic screen-lock delay.');
Q('حماية الجهاز','Device protection','كيف تتعامل مع أدوات الحماية والتنبيهات الأمنية في جهازك؟','How do you handle device security tools and alerts?',
['أعطلها إذا منعت برنامجا أريده.','أغلق التنبيهات دون قراءتها.','أبقي الحماية مفعلة لكن أؤجل مراجعة التنبيهات.','أبقي الحماية المدمجة أو الموثوقة محدثة، وأراجع التنبيهات عبر إعدادات الجهاز.'],
['I disable them if they block a program I want.','I dismiss alerts without reading them.','I keep protection on but delay reviewing alerts.','I keep built-in or trusted protection updated and review alerts through device settings.'],
'تعطيل الحماية أو تجاهل التنبيهات الحقيقية قد يسمح باستمرار برنامج ضار.','Disabled protection or ignored genuine alerts can allow malware to persist.',
'راجع حالة الحماية من إعدادات الجهاز، ولا تثبت برنامجا من نافذة تخويف في المتصفح.','Check protection in device settings; do not install software from a browser scare pop-up.');
Q('تنزيل التطبيقات','Downloading apps','من أين تنزل التطبيقات والبرامج؟','Where do you download apps and software?',
['من روابط عشوائية أو نسخ مدفوعة مكسورة الحماية.','من أول نتيجة أو إعلان يظهر لي.','من متجر رسمي، دون مراجعة المطور أو الصلاحيات.','من متجر أو موقع مطور رسمي مع مراجعة اسم المطور والصلاحيات.'],
['Random links or cracked paid software.','The first result or advert I see.','An official store, without checking the developer or permissions.','An official store or developer site, checking the developer and permissions.'],
'قد تتنكر البرامج الضارة في شكل تطبيق مفيد، حتى في بعض المتاجر.','Malware can pose as a useful app, including in some stores.',
'راجع المطور والصلاحيات قبل التنزيل، واحذف التطبيقات التي لا تحتاجها.','Check the developer and permissions before downloading; remove apps you no longer need.');
Q('مشاركة الجهاز','Sharing a device','عندما يحتاج شخص آخر إلى استخدام حاسوبك، ماذا تفعل؟','When someone needs to use your computer, what do you do?',
['أعطيه الجهاز مفتوحا وكلمة دخولي.','أتركه يستخدم حسابي وفيه البريد والملفات مفتوحة.','أغلق التطبيقات الحساسة وأبقى بجواره.','أستخدم حساب ضيف أو حسابا منفصلا بصلاحيات محدودة.'],
['I give them the unlocked device and my password.','I let them use my account with email and files open.','I close sensitive apps and stay nearby.','I use a guest or separate account with limited permissions.'],
'مشاركة حسابك تكشف الملفات والجلسات المفتوحة وتسمح بتغيير الإعدادات.','Sharing your account exposes files and signed-in sessions and allows settings changes.',
'أنشئ حسابا منفصلا محدود الصلاحيات عند مشاركة الحاسوب.','Create a separate account with limited permissions when sharing a computer.');
Q('نشر المعلومات الشخصية','Posting personal information','كيف تنشر معلوماتك الشخصية على الإنترنت؟','How do you post personal information online?',
['أنشر صور الوثائق والعنوان والتفاصيل دون تقييد.','أنشر تفاصيل كثيرة وأثق أن الغرباء لن يهتموا.','أشارك مع الأصدقاء فقط لكن قد أظهر معلومات غير ضرورية.','أشارك أقل قدر لازم وأخفي الوثائق والعنوان والموقع الحي.'],
['I post document photos, my address, and details without restrictions.','I post many details and assume strangers will not care.','I share only with friends but may include unnecessary details.','I share only what is needed and hide documents, my address, and live location.'],
'التفاصيل المنشورة قد تساعد على الانتحال والاحتيال الموجه.','Published details can support impersonation and targeted scams.',
'راجع منشوراتك القديمة واحذف صور الوثائق والبيانات التي لا يلزم نشرها.','Review old posts and remove document photos and unnecessary personal details.');
Q('صلاحيات التطبيقات','App permissions','يطلب تطبيق مصباح الوصول إلى جهات الاتصال والموقع. ماذا تفعل؟','A flashlight app asks for contacts and location access. What do you do?',
['أوافق على كل الصلاحيات.','أوافق ما دام التطبيق مجانيا.','أرفض بعض الصلاحيات وأترك الموقع مفعلا دون حاجة.','أرفض الصلاحيات غير الضرورية وأختار بديلا إن أصر التطبيق.'],
['I allow every permission.','I allow them if the app is free.','I refuse some but leave location enabled unnecessarily.','I refuse unnecessary permissions and choose an alternative if the app insists.'],
'الصلاحيات غير الضرورية توسع الوصول إلى بيانات لا يحتاجها التطبيق.','Unnecessary permissions expose data that the app does not need.',
'راجع صلاحيات الموقع والكاميرا والميكروفون، واسمح بها عند الحاجة فقط.','Review location, camera, and microphone permissions; allow access only when needed.');
Q('شبكات واي فاي العامة','Public Wi-Fi','تحتاج إلى تنفيذ عملية مالية وأنت على شبكة واي فاي عامة. ماذا تفعل؟','You need to make a financial transaction while on public Wi-Fi. What do you do?',
['أستخدم أي شبكة وأتجاوز تحذيرات الاتصال.','أثق في الشبكة إذا كان اسمها اسم المقهى.','أتحقق من الشبكة وأستخدم التطبيق الرسمي ولا أتجاوز تحذيرات الأمان.','أنتقل إلى بيانات الهاتف أو شبكة موثوقة، وأستخدم التطبيق الرسمي.'],
['I use any network and bypass connection warnings.','I trust a network if its name matches the café.','I verify the network, use the official app, and respect security warnings.','I switch to mobile data or a trusted network and use the official app.'],
'قد تكون الشبكة منتحلة؛ التشفير يحمي الاتصال لكنه لا يجعل الشبكة أو الموقع موثوقا تلقائيا.','A network can be impersonated; encryption does not automatically make the network or website trustworthy.',
'استخدم بيانات الهاتف للمعاملات الحساسة، ولا تتجاوز تحذيرات الشهادات.','Use mobile data for sensitive transactions and never bypass certificate warnings.');
Q('أمان المواقع','Website safety','قبل إدخال بياناتك في موقع، ما الذي تتحقق منه؟','Before entering details on a website, what do you check?',
['لا أتحقق ما دام شكل الموقع جيدا.','أكتفي بوجود علامة القفل أو HTTPS.','أتحقق من HTTPS واسم النطاق، لكن أصل إليه غالبا من إعلانات.','أدخل من عنوان رسمي معروف، وأراجع النطاق وHTTPS وأتوقف عند أي تحذير.'],
['Nothing, as long as the site looks good.','Only a padlock or HTTPS.','I check HTTPS and the domain but often arrive through adverts.','I use a known official address, check the domain and HTTPS, and stop at warnings.'],
'HTTPS يشفر الاتصال ولا يثبت أن صاحب الموقع جهة أمينة.','HTTPS encrypts the connection; it does not prove that the site owner is honest.',
'احفظ المواقع المهمة في المفضلة بعد التحقق من عناوينها الرسمية.','Bookmark important websites after verifying their official addresses.');
Q('خصوصية التواصل الاجتماعي','Social media privacy','كيف تضبط خصوصية حسابات التواصل الاجتماعي؟','How do you manage social media privacy?',
['حسابي عام وأقبل جميع الطلبات.','أقيد بعض المنشورات لكن أقبل أشخاصا لا أعرفهم.','أقصر الجمهور على المعارف، لكن لا أراجع الإعدادات والتطبيقات المتصلة.','أحدد الجمهور وأراجع المتابعين والإعدادات والتطبيقات المتصلة دوريا.'],
['My account is public and I accept all requests.','I restrict some posts but accept strangers.','I limit the audience to people I know but do not review settings or connected apps.','I choose the audience and regularly review followers, settings, and connected apps.'],
'الجمهور الواسع والتطبيقات المنسية قد يحصلان على معلومات أكثر مما تقصد.','A broad audience and forgotten connected apps can see more than you intend.',
'راجع من يرى منشوراتك وأزل التطبيقات المتصلة التي لم تعد تستخدمها.','Review who can see your posts and remove connected apps you no longer use.');
Q('حماية الأسرة والأطفال','Protecting family and children','كيف تساعد طفلا أو فردا من الأسرة قليل الخبرة على استخدام الإنترنت بأمان؟','How do you help a child or less experienced family member use the internet safely?',
['أتركه يستخدمه دون نقاش أو إرشاد.','أكتفي بتحذيره ألا يخطئ.','أشرح بعض المخاطر مرة واحدة أو أفعل قيودا دون نقاش.','نتحدث بانتظام، ونضبط حماية مناسبة للعمر، ونتفق على طلب المساعدة بلا لوم.'],
['I leave them to use it without guidance.','I only warn them not to make mistakes.','I explain some risks once or set restrictions without discussion.','We talk regularly, set age-appropriate protections, and agree to ask for help without blame.'],
'الخوف من اللوم قد يؤخر طلب المساعدة عند التعرض للاحتيال أو المضايقة.','Fear of blame can delay asking for help after a scam or harassment.',
'اتفق مع الأسرة على إخبار شخص موثوق فورا عند طلب مال أو معلومات أو صور خاصة.','Agree to tell a trusted person promptly about requests for money, details, or private images.');
Q('الدفع البنكي الآمن','Safe banking and payments','قبل تأكيد تحويل أو دفع إلكتروني، ماذا تفعل؟','Before confirming a transfer or online payment, what do you do?',
['أوافق بسرعة دون قراءة التفاصيل.','أراجع المبلغ فقط.','أراجع المبلغ والمستفيد، لكن أتجاهل رسالة البنك التفصيلية.','أستخدم القناة الرسمية وأراجع المستفيد والمبلغ والغرض في شاشة ورسالة التأكيد.'],
['I approve quickly without reading details.','I check only the amount.','I check the amount and recipient but ignore the bank’s detailed message.','I use the official channel and check recipient, amount, and purpose in the confirmation screen and message.'],
'قد يكون التأكيد لعملية مختلفة عن التي تتوقعها.','A confirmation may authorize a different transaction from the one you expect.',
'اقرأ تفاصيل كل عملية قبل اعتمادها، وفعل إشعارات الحساب.','Read each transaction’s details before approving and enable account alerts.');
Q('رموز التحقق','Verification codes','يطلب منك متصل يدعي أنه موظف بنك رمز تحقق وصلك للتو. ماذا تفعل؟','A caller claiming to work for your bank asks for a verification code you just received. What do you do?',
['أعطيه الرمز فورا.','أعطيه الرمز إذا عرف اسمي أو بيانات حسابي.','أرفض مشاركة الرمز لكن أستمر في مناقشة تفاصيل الحساب معه.','أرفض وأنهي الاتصال، وأتواصل مع البنك عبر رقمه الرسمي عند وجود محاولة غير معروفة.'],
['I give the code immediately.','I give it if they know my name or account details.','I refuse the code but keep discussing account details.','I refuse, end the call, and contact the official bank number about an unrecognized attempt.'],
'رمز التحقق قد يسمح بدخول الحساب أو اعتماد تحويل مالي.','A verification code may allow account access or authorize a transfer.',
'لا تشارك رمز التحقق مع متصل؛ أدخله فقط في خدمة رسمية لعملية بدأتها وتحققت منها.','Never give a verification code to a caller; enter it only in an official service for an action you initiated and checked.');
Q('التسوق الإلكتروني','Online shopping','تجد متجرا جديدا بأسعار منخفضة جدا. كيف تقرر الشراء؟','You find a new shop with very low prices. How do you decide whether to buy?',
['أحول المال فورا حتى لا يفوتني العرض.','أثق بصور المنتجات وتعليقات صفحة المتجر.','أبحث عن تقييمات مستقلة، لكن أقبل التحويل لحساب شخصي.','أتحقق من المتجر وسياسة الإرجاع والتقييمات المستقلة، وأختار وسيلة دفع توفر حماية مناسبة.'],
['I transfer money immediately before the offer ends.','I trust product photos and comments on the store’s page.','I check independent reviews but accept payment to a personal account.','I check the seller, returns policy, independent reviews, and use a payment method with suitable protection.'],
'الصور والتقييمات قد تكون مزيفة، واسترداد التحويل المباشر قد يكون صعبا.','Photos and reviews can be fake, and direct transfers may be hard to recover.',
'تحقق من المتجر خارج صفحته، وتجنب الدفع لحساب شخصي تحت ضغط عرض عاجل.','Check the seller beyond its own page; avoid paying a personal account under time pressure.');
Q('طلبات المال العائلية','Family money requests','تصلك رسالة من رقم جديد تقول: أنا قريبك وأحتاج تحويلا عاجلا. ماذا تفعل؟','A new number messages: “I am your relative and urgently need a transfer.” What do you do?',
['أحول المبلغ مباشرة.','أثق بالصورة والاسم أو الرسالة الصوتية.','أسأل أسئلة شخصية داخل المحادثة فقط.','أتصل بقريبي على رقمه المعروف أو أتحقق عبر شخص موثوق قبل التحويل.'],
['I transfer immediately.','I trust the photo, name, or voice message.','I ask personal questions only in that chat.','I call my relative on their known number or verify through a trusted person before transferring.'],
'يمكن تقليد الاسم والصورة وحتى الصوت، وقد تكون المعلومات الشخصية معروفة للمحتال.','Names, photos, and even voices can be imitated; scammers may know personal facts.',
'اتفقوا في الأسرة على التحقق باتصال مستقل قبل أي تحويل مالي غير معتاد.','Agree as a family to verify unusual money requests through a separate call.');

const privacyLong=pair('هذا الموقع لا يجمع أي بيانات عن المستخدمين، ولا يقوم بتخزين أو إرسال أي بيانات شخصية أو بيانات تتعلق باستخدام الموقع. تتم جميع إجابات الاختبار وعمليات احتساب النتائج محليا داخل متصفح المستخدم فقط، ولا يتم إرسالها أو حفظها على أي خادم أو قاعدة بيانات.','This website does not collect, store, or transmit any user data, including personal information or website usage data. All assessment responses and score calculations are processed locally within the user’s browser and are not sent to or stored on any server or database.');
const disclaimer=pair('تقييم ذاتي توعوي مبني على إجاباتك، وليس شهادة أمن سيبراني أو فحص ثغرات أو تدقيقا أمنيا مهنيا. الدرجات والمستويات إرشادية وليست مقياسا علميا معتمدا أو ضمانا للحماية.','An educational self-assessment based on your responses, not a cybersecurity certificate, vulnerability assessment, or professional security audit. Scores and levels are guidance, not a validated scientific measure or a guarantee of protection.');
function shuffle(){orders=questions.map(()=>{const a=[0,1,2,3];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;});}
function privacy(){return `<div class="card privacy">${icon('lock')}<div><h3>${tr('خصوصيتك محفوظة','Your Privacy Is Protected')}</h3><p>${T(privacyLong)}</p><strong>${T(privacyShort)}</strong><p>${tr('تبقى الإجابات مؤقتا في ذاكرة الصفحة وتزول عند إعادة تحميلها أو إغلاقها. لا تستخدم الصفحة ملفات تعريف الارتباط أو التخزين الدائم.','Answers exist temporarily in page memory and disappear when you reload or close it. This page uses no cookies or persistent storage.')}</p></div></div>`;}
function team(){return `<div class="grid2 team"><article class="card"><div class="initial">${icon()}</div><div class="team-label">${tr('صاحب المبادرة','Initiative Owner')}</div><h3>${T(owner)}</h3><p>${tr('طالب – ','Student – ')}${T(college)}</p></article><article class="card"><div class="initial">${icon()}</div><div class="team-label">${tr('المشرف على المبادرة','Initiative Supervisor')}</div><h3>${T(supervisor)}</h3><p>${tr('أستاذ مشارك – ','Associate Professor – ')}${T(college)}</p></article></div>`;}
function renderFooter(){document.getElementById('footer').innerHTML=`<div class="wrap"><div class="foot-grid"><div><strong>${T(title)}</strong><p>${tr('صاحب المبادرة: ','Initiative Owner: ')}${T(owner)}<br>${tr('طالب – ','Student – ')}${T(college)}</p><p>${tr('المشرف على المبادرة: ','Initiative Supervisor: ')}${T(supervisor)}<br>${tr('أستاذ مشارك – ','Associate Professor – ')}${T(college)}</p></div><div><p>${T(disclaimer)}</p><p>${tr('لا يتم جمع أو تخزين أي بيانات شخصية أو استخدامية.','No personal or usage data is collected or stored.')}</p><strong>${tr('مصادر للتعلم','Learning resources')}</strong><div class="sources"><a href="https://www.cisa.gov/secure-our-world" target="_blank" rel="noopener noreferrer">${tr('CISA — خطوات الحماية الرقمية','CISA — Secure Our World')}</a><a href="https://consumer.ftc.gov/articles/how-recognize-and-avoid-phishing-scams" target="_blank" rel="noopener noreferrer">${tr('FTC — تجنب التصيد','FTC — Avoid Phishing')}</a><a href="https://consumer.ftc.gov/articles/online-shopping" target="_blank" rel="noopener noreferrer">${tr('FTC — التسوق الإلكتروني','FTC — Online Shopping')}</a></div><small>${tr('المصادر باللغة الإنجليزية. فتحها ينقلك إلى مواقع خارجية لها سياسات خصوصية مستقلة. لا تمثل هذه الروابط اعتمادا للمبادرة.','Resources are in English. Opening them visits external sites with separate privacy policies. These links do not imply endorsement of this initiative.')}</small></div></div></div>`;}
function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';render();}
function render(){document.title=T(title);document.getElementById('college-name').textContent=tr('كلية الحاسب الآلي وتقنية المعلومات','College of Computing and Information Technology');document.getElementById('university-name').textContent=tr('جامعة شقراء','Shaqra University');document.getElementById('brand').textContent=T(title);document.getElementById('skip').textContent=tr('انتقل إلى المحتوى','Skip to content');['ar','en'].forEach(l=>document.getElementById('lang-'+l).setAttribute('aria-pressed',String(lang===l)));document.getElementById('main').innerHTML=screen==='home'?home():screen==='quiz'?quiz():results();renderFooter();if(screen==='results')attachChart();}
function focusMain(){document.getElementById('main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}
function home(){return `<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">${icon()} ${tr('خطوة صغيرة لحياة رقمية أكثر أمانا','A small step toward a safer digital life')}</div><h1>${tr('اختبر وعيك السيبراني<br><em>واحم نفسك وأسرتك</em>','Test your cyber awareness.<br><em>Protect yourself and your family.</em>')}</h1><p class="intro">${tr('اكتشف عاداتك الرقمية الجيدة، وتعرف على ما يمكنك تحسينه من خلال مواقف من الحياة اليومية ونصائح تناسب إجاباتك.','Discover your good digital habits and what you can improve through everyday situations and advice tailored to your answers.')}</p><div class="cta"><button class="btn primary" onclick="start()">${tr('ابدأ الاختبار','Start Assessment')} ${icon()}</button></div><p class="micro">${T(privacyShort)}</p></div><aside class="overview"><h3>${tr('خمس مساحات لحمايتك الرقمية','Five areas of digital protection')}</h3>${categories.map((c,i)=>`<div class="overview-row"><span>0${i+1}</span><strong>${T(c)}</strong></div>`).join('')}</aside></div></section><div class="stats"><div class="stat"><b>25</b><span>${tr('سؤالا من واقع الحياة','Everyday questions')}</span></div><div class="stat"><b>5</b><span>${tr('محاور أساسية','Essential areas')}</span></div><div class="stat"><b>100</b><span>${tr('درجة للتقييم','Assessment points')}</span></div><div class="stat"><b>${tr('لك','For you')}</b><span>${tr('توصيات شخصية','Personalized advice')}</span></div></div><div class="wrap"><section class="section">${privacy()}</section><section class="section"><div class="section-head"><h2>${tr('فريق المبادرة','Initiative Team')}</h2></div>${team()}</section><section class="section grid2"><article class="card"><h2>${tr('وعي ينعكس على حياتك','Awareness for everyday life')}</h2><p class="sub">${tr('تهدف المبادرة إلى مساعدة أفراد المجتمع على التعرف على مستوى وعيهم بالأمن السيبراني واكتشاف السلوكيات التي قد تعرضهم أو أسرهم للمخاطر. تحصل على تقييم شخصي ونصائح عملية لتعزيز أمن حساباتك وأجهزتك وبياناتك أثناء استخدام الخدمات الرقمية.','This initiative helps community members understand their cybersecurity awareness and recognize habits that may put themselves or their families at risk. Receive a personal assessment and practical advice to strengthen the security of your accounts, devices, and data when using digital services.')}</p></article><article class="card"><h2>${tr('قبل أن تبدأ','Before you begin')}</h2><ol class="list-clean"><li>${tr('اختر السلوك الأقرب لما تفعله فعلا؛ وإن لم تواجه الموقف، اختر ما ستفعله.','Choose what you actually do; if a situation is unfamiliar, choose what you would do.')}</li><li>${tr('يمكنك الرجوع وتعديل إجاباتك أو تغيير اللغة دون فقدها.','You can go back, change answers, or switch language without losing progress.')}</li><li>${tr('أجب عن الأسئلة كلها لرؤية النتيجة وخطتك الشخصية.','Answer every question to see your results and personal plan.')}</li></ol><p class="sub">${tr('لكل سؤال 1–4 درجات؛ لذلك تتراوح النتيجة الفعلية بين 25 و100. لكل محور 5 أسئلة و20 درجة كحد أقصى.','Each question earns 1–4 points, so the possible total is 25–100. Each area has 5 questions and a maximum of 20 points.')}</p></article></section></div>`;}
function restartButton(){return `<button type="button" class="btn restart" onclick="start()"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1.8 8M3 4v6h6"/></svg>${tr('البدء من جديد ومسح الإجابات','Restart and Clear Answers')}</button>`;}
function start(){answers=Array(25).fill(null);current=0;selectedChart=0;shuffle();screen='quiz';render();focusMain();}
function quiz(){const cat=Math.floor(current/5),q=questions[current],done=answers.filter(a=>a!==null).length;return `<div class="wrap stage fade"><div class="quiz-toolbar no-print"><p class="sub">${tr('يمكنك بدء اختبار جديد بإجابات فارغة في أي وقت.','Start a fresh assessment with empty answers at any time.')}</p>${restartButton()}</div><div class="quiz-layout"><aside class="card side"><h3>${tr('رحلتك في التقييم','Your assessment journey')}</h3>${categories.map((c,i)=>`<div class="step ${cat===i?'active':''} ${answers.slice(i*5,i*5+5).every(a=>a!==null)?'done':''}" ${cat===i?'aria-current="step"':''}><span class="step-num">${i+1}</span><span>${T(c)}</span></div>`).join('')}<p class="sub">${tr('إجاباتك تبقى في متصفحك فقط.','Your answers stay in your browser.')}</p></aside><div><section class="card question"><div class="quiz-meta"><span>${tr('السؤال','Question')} <b>${current+1}</b> ${tr('من','of')} 25</span><span id="completion">${done*4}% ${tr('مكتمل','complete')}</span></div><div class="track" role="progressbar" aria-label="${tr('تقدم الإجابات','Answers completed')}" aria-valuemin="0" aria-valuemax="25" aria-valuenow="${done}" id="progress"><div class="fill" style="width:${done*4}%"></div></div><div class="q-head"><span class="team-label">${tr('المحور','Area')} ${cat+1} / 5 · ${T(categories[cat])}</span></div><fieldset aria-describedby="q-help"><legend id="q-title">${T(q.text)}</legend><div class="choices">${orders[current].map(i=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''} onchange="choose(${i})"><span>${T(q.options[i].label)}</span></label>`).join('')}</div></fieldset><p id="q-help" class="sub" style="margin-top:14px">${tr('اختر إجابة واحدة تصف سلوكك المعتاد.','Choose one answer that describes your usual behavior.')}</p><div class="error" id="error" role="alert"></div><div class="quiz-nav"><button class="btn" onclick="prev()" ${current===0?'disabled':''}>${tr('السابق','Previous')}</button><button class="btn dark" onclick="next()">${current===24?tr('اعرض نتيجتي','View My Results'):tr('التالي','Next')}</button></div></section><div class="q-foot"><span>${icon('lock')} ${tr('معالجة محلية · بلا تسجيل أو تتبع','Local processing · No registration or tracking')}</span><span>${tr('يمكنك تعديل إجاباتك قبل التسليم.','You can edit answers before submitting.')}</span></div></div></div></div>`;}
function choose(i){answers[current]=i;document.getElementById('error').textContent='';const n=answers.filter(a=>a!==null).length;document.getElementById('completion').textContent=n*4+'% '+tr('مكتمل','complete');const p=document.getElementById('progress');p.setAttribute('aria-valuenow',n);p.firstElementChild.style.width=n*4+'%';}
function prev(){if(current>0){current--;render();focusMain();}}
function next(){if(answers[current]===null){document.getElementById('error').textContent=tr('اختر إجابة قبل المتابعة.','Please choose an answer before continuing.');document.querySelector('input[name=answer]').focus();return;}if(current<24){current++;render();focusMain();return;}const missing=answers.indexOf(null);if(missing!==-1){current=missing;render();document.getElementById('error').textContent=tr('أجب عن هذا السؤال لإكمال التقييم.','Answer this question to complete the assessment.');focusMain();return;}screen='results';render();focusMain();}
function scores(){return categories.map((_,c)=>questions.slice(c*5,c*5+5).reduce((s,q,j)=>s+q.options[answers[c*5+j]].score,0));}
function level(s){return s>=90?tr('وعي ممتاز','Excellent Awareness'):s>=80?tr('وعي جيد جدا','Very Good Awareness'):s>=60?tr('وعي جيد','Good Awareness'):s>=40?tr('يحتاج إلى تحسين','Needs Improvement'):tr('يحتاج إلى تحسين كبير','High Risk');}
function status(s){return s>=16?tr('نقطة قوة','Strength'):s>=12?tr('قابل للتحسين','Room to improve'):tr('أولوية للتحسين','Priority for improvement');}
function cls(s){return s>=16?'':s>=12?'mid':'low';}
function sortedQuestions(){return questions.map((q,i)=>({q,i,score:q.options[answers[i]].score})).sort((a,b)=>a.score-b.score||([22,21,24,3,1,5,7].includes(b.i)?1:0)-([22,21,24,3,1,5,7].includes(a.i)?1:0)||a.i-b.i);}
function results(){const s=scores(),total=s.reduce((a,b)=>a+b,0),rank=sortedQuestions(),strong=s.map((v,i)=>({v,i})).filter(x=>x.v>=16),weak=s.map((v,i)=>({v,i})).filter(x=>x.v<16).sort((a,b)=>a.v-b.v),max=Math.max(...s),min=Math.min(...s),risky=rank.filter(x=>x.score<=2),plan=rank.filter(x=>x.score<4).slice(0,5);if(plan.length<3){for(const x of rank){if(!plan.some(y=>x.i===y.i))plan.push(x);if(plan.length>=3)break;}}
return `<div class="wrap stage fade"><div class="result-head"><div><div class="team-label">${tr('اكتملت خطوتك الأولى','Your first step is complete')}</div><h1 style="font-size:2rem">${tr('صورتك الرقمية، بوضوح','Your digital habits, clearly')}</h1><p class="sub">${tr('كل عادة آمنة تصنع فرقا. هذه نقطة انطلاقك للخطوة التالية.','Every safer habit makes a difference. Here is where to begin next.')}</p></div><div class="actions">${restartButton()}<button class="btn dark" onclick="printResults()">${tr('طباعة النتيجة','Print Results')}</button></div></div><div class="result-top"><section class="score-card"><h2>${tr('درجة وعيك بالأمن السيبراني','Your Cybersecurity Awareness Score')}</h2><div class="score-ring" style="--score:${total}" role="img" aria-label="${total} / 100"><div class="score-core"><b>${total}</b><small>${tr('من 100','out of 100')}</small></div></div><span class="badge ${cls(total/5)}">${level(total)}</span><p class="sub">${total>=80?tr('عادات قوية تستحق الاستمرار. راجع التفاصيل لتعزيز حمايتك.','Strong habits worth keeping. Review the details to strengthen your protection.'):tr('يمكنك التحسن بخطوات بسيطة. ابدأ بالإجراءات المقترحة أدناه.','You can improve with small steps. Start with the suggested actions below.')}</p><p style="font-size:.8rem;color:#d2e0ed">${tr('النطاق الممكن: 25–100 · تقييم ذاتي إرشادي','Possible range: 25–100 · Educational self-assessment')}</p></section><section class="card chart-wrap"><h2>${tr('توازن وعيك السيبراني','Your awareness profile')}</h2><p class="sub">${tr('اختر محورا لعرض درجته.','Select an area to see its score.')}</p>${radar(s)}<div class="chart-tip" id="chart-tip" aria-live="polite"></div><div class="chart-keys">${shortCats.map((c,i)=>`<button class="key" data-chart="${i}" aria-pressed="${selectedChart===i}">${T(c)}</button>`).join('')}</div></section></div><section class="section"><div class="section-head"><h2>${tr('نتيجتك في كل محور','Your Results by Area')}</h2><span class="sub">${tr('5 أسئلة لكل محور','5 questions per area')}</span></div><div class="categories">${s.map((v,i)=>`<article class="card cat-card"><div class="team-label">0${i+1}</div><h3>${T(categories[i])}</h3><div class="cat-score"><b><bdi>${v} / 20</bdi></b><span><bdi>${v*5}% · ${v/2} / 10</bdi></span></div><div class="track" role="meter" aria-label="${T(categories[i])}" aria-valuemin="0" aria-valuemax="20" aria-valuenow="${v}"><div class="fill" style="width:${v*5}%;background:${v>=16?'var(--green)':v>=12?'var(--amber)':'var(--red)'}"></div></div><span class="badge ${cls(v)}">${status(v)}</span><p>${v===20?tr('اخترت أكثر السلوكيات أمانا في هذا المحور. حافظ عليها وراجعها بانتظام.','You chose the safest behaviors in this area. Keep them up and review them regularly.'):v>=16?tr('تتبع عادات جيدة في هذا المحور، مع فرص محددة لزيادة الحماية.','You follow good habits in this area, with specific opportunities to improve.'):v>=12?tr('لديك بعض العادات الآمنة، لكن سلوكيات أخرى تحتاج إلى تعديل.','You have some safer habits, but other behaviors need adjustment.'):tr('ابدأ بهذا المحور لتقليل السلوكيات التي قد تعرضك للاحتيال أو فقدان البيانات.','Start here to reduce behaviors that can expose you to scams or data loss.')}</p></article>`).join('')}</div></section><section class="section grid2"><article class="card"><h2>${tr('نقاط القوة','Your Strengths')}</h2><p class="sub">${tr('الأعلى درجة: ','Highest scoring: ')}${s.map((v,i)=>v===max?T(shortCats[i]):null).filter(Boolean).join('، ')} <bdi>(${max}/20)</bdi></p>${strong.length?`<ul class="list-clean">${strong.map(x=>`<li>${T(categories[x.i])}: ${tr('تعكس إجاباتك عادات آمنة عديدة تستحق الاستمرار.','Your answers reflect several safer habits worth keeping.')}</li>`).join('')}</ul>`:`<p>${tr('لم يصل أي محور بعد إلى حد نقطة القوة (16/20). يمكنك بناء نقطة قوة بدءا بأكثر عاداتك أمانا.','No area has reached the strength threshold of 16/20 yet. Build on your safest existing habits.')}</p>`}</article><article class="card"><h2>${tr('جوانب تحتاج إلى تحسين','Areas to Improve')}</h2><p class="sub">${tr('الأقل درجة: ','Lowest scoring: ')}${s.map((v,i)=>v===min?T(shortCats[i]):null).filter(Boolean).join('، ')} <bdi>(${min}/20)</bdi></p>${weak.length?`<ul class="list-clean">${weak.map(x=>`<li>${T(categories[x.i])}: ${tr('امنح هذا المحور اهتماما في خطتك التالية.','Give this area attention in your next steps.')}</li>`).join('')}</ul>`:`<p>${tr('جميع المحاور ضمن نقاط القوة. استخدم الخطة للحفاظ على عاداتك ومعالجة أي تفاصيل متبقية.','All areas meet the strength threshold. Use your plan to maintain habits and address any remaining details.')}</p>`}</article></section><section class="section card plan"><h2>${tr('خطتك لتحسين أمنك الرقمي','Your Cybersecurity Improvement Plan')}</h2><p class="sub">${total===100?tr('اخترت السلوك الأكثر أمانا في كل موقف؛ هذه إجراءات للمحافظة على مستواك.','You chose the safest behavior in every situation; these actions help maintain your habits.'):tr('تبدأ الخطة بالإجابات الأقل أمانا، مع تقديم مخاطر المال والحسابات عند تساوي الدرجات.','The plan starts with your least secure answers, prioritizing money and account risks when scores are tied.')}</p><ol class="plan-list">${plan.map(x=>`<li><div><strong>${T(x.q.topic)}</strong><p>${T(x.q.tip)}</p></div></li>`).join('')}</ol></section><section class="section"><div class="section-head"><div><h2>${tr('تعلم من إجاباتك','Learn From Your Answers')}</h2><p class="sub">${tr('مراجعة الإجابات الأكثر خطورة (1 أو 2 من 4). افتح كل بند للتعلم.','Review higher-risk answers (1 or 2 out of 4). Open each item to learn.')}</p></div></div>${risky.length?`<div class="card learn">${risky.map(x=>`<details><summary>${T(x.q.topic)} <span class="badge low">${tr('يستحق المراجعة','Worth reviewing')}</span></summary><div class="learn-content"><p><strong>${T(x.q.text)}</strong></p><p class="answer-pill">${tr('إجابتك: ','Your answer: ')}${T(x.q.options[answers[x.i]].label)}</p><p><strong>${tr('لماذا يحتاج السلوك إلى انتباه؟ ','Why does this need attention? ')}</strong>${T(x.q.why)}</p><p><strong>${tr('السلوك الأكثر أمانا: ','Safer behavior: ')}</strong>${T(x.q.options[3].label)}</p><p><strong>${tr('خطوة عملية: ','Practical step: ')}</strong>${T(x.q.tip)}</p></div></details>`).join('')}</div>`:`<div class="card"><h3>${tr('لم تختر أيا من السلوكيات الأعلى خطورة.','You did not select any higher-risk behaviors.')}</h3><p class="sub">${tr('راجع خطتك الشخصية للاستمرار في التحسن.','Review your personal plan to keep improving.')}</p></div>`}</section><section class="section card"><h2>${tr('احم نفسك وأسرتك','Protect Yourself and Your Family')}</h2><ul class="list-clean"><li>${tr('علم الأطفال عدم مشاركة كلمات المرور وطلب المساعدة عند أي موقف مزعج، مع ضوابط تناسب أعمارهم.','Teach children to keep passwords private and ask for help when uncomfortable, with age-appropriate controls.')}</li><li>${tr('ناقش أساليب الاحتيال مع كبار السن، واجعل طلب المساعدة أمرا سهلا وبلا لوم.','Discuss scams with older relatives and make it easy to ask for help without blame.')}</li><li>${tr('لا تشاركوا رموز التحقق مع المتصلين، وتحققوا باتصال مستقل من طلبات المال.','Do not share verification codes with callers; verify money requests through a separate call.')}</li><li>${tr('حافظوا على تحديث أجهزة الأسرة وراجعوا إعدادات الخصوصية معا.','Keep family devices updated and review privacy settings together.')}</li></ul></section><section class="section card"><h3>${tr('كيف تقرأ النتيجة؟','How to Read Your Score')}</h3><p class="sub">${tr('تجمع الدرجات من 1 إلى 4 لكل إجابة. النسبة لكل محور هي درجته مقسومة على 20، وليست نسبة احتمال الأمان أو عدد إجابات صحيحة.','Answers earn 1–4 points. Each area’s percentage is its score divided by 20, not a probability of safety or a count of correct answers.')}</p><p class="sub"><bdi>0–39</bdi>: ${level(30)} · <bdi>40–59</bdi>: ${level(50)} · <bdi>60–79</bdi>: ${level(70)} · <bdi>80–89</bdi>: ${level(85)} · <bdi>90–100</bdi>: ${level(95)}</p><p class="sub">${tr('الدرجات من 0 إلى 24 غير ممكنة في هذا النظام. نقطة القوة: 16–20؛ قابل للتحسين: 12–15؛ أولوية للتحسين: 5–11.','Scores from 0 to 24 cannot occur in this system. Strength: 16–20; room to improve: 12–15; priority for improvement: 5–11.')}</p><p class="sub">${T(disclaimer)}</p></section></div>`;}
function radar(s){const cx=200,cy=145,r=110,xy=(i,scale)=>[cx+Math.sin(i*2*Math.PI/5)*r*scale,cy-Math.cos(i*2*Math.PI/5)*r*scale];return `<svg viewBox="0 0 400 285" class="radar" role="group" aria-label="${tr('رسم تفاعلي لدرجات المحاور من 20','Interactive chart of area scores out of 20')}">${[.25,.5,.75,1].map(k=>`<polygon points="${s.map((_,i)=>xy(i,k).join(',')).join(' ')}" fill="none" stroke="#cbdbe5"/>`).join('')}${s.map((_,i)=>`<line x1="${cx}" y1="${cy}" x2="${xy(i,1)[0]}" y2="${xy(i,1)[1]}" stroke="#d9e4ed"/>`).join('')}<polygon points="${s.map((v,i)=>xy(i,v/20).join(',')).join(' ')}" fill="#18a5a5" fill-opacity=".17" stroke="#08787c" stroke-width="2.5"/>${s.map((v,i)=>{const [x,y]=xy(i,v/20),[lx,ly]=xy(i,1.14);return `<text x="${lx}" y="${ly+5}" font-size="14" text-anchor="middle" fill="#334e68">${i+1}</text><g class="point" tabindex="0" role="button" data-chart="${i}" aria-label="${T(categories[i])}: ${v}/20"><circle cx="${x}" cy="${y}" r="16" fill="transparent"/><circle cx="${x}" cy="${y}" r="5" fill="#08787c" pointer-events="none"/><title>${T(categories[i])}: ${v}/20</title></g>`;}).join('')}</svg>`;}
function attachChart(){const s=scores();function show(i){selectedChart=i;document.getElementById('chart-tip').textContent=T(categories[i])+': '+s[i]+' / 20 ('+s[i]*5+'%)';document.querySelectorAll('.key').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.chart)===i?'true':'false'));}document.querySelectorAll('[data-chart]').forEach(b=>{b.addEventListener('click',()=>show(Number(b.dataset.chart)));b.addEventListener('focus',()=>show(Number(b.dataset.chart)));b.addEventListener('pointerenter',()=>show(Number(b.dataset.chart)));if(b.tagName.toLowerCase()==='g')b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(Number(b.dataset.chart));}});});show(selectedChart);}
let printOpen=[];
window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('.learn details')].map(x=>x.open);document.querySelectorAll('.learn details').forEach(x=>x.open=true);});
window.addEventListener('afterprint',()=>document.querySelectorAll('.learn details').forEach((x,i)=>x.open=printOpen[i]||false));
function printResults(){window.print();}
window.addEventListener('pagehide',()=>{answers.fill(null);screen='home';current=0;});
window.addEventListener('pageshow',e=>{if(e.persisted)render();});
render();
</script>
